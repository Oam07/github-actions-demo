name: Demo CI Pipeline

on:
  push:
  pull_request:

jobs:
  scan:
    name: Scan Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanning and testing tools
        run: python -m pip install ruff pytest pytest-cov

      - name: Scan Python code
        run: ruff check .
        
      - name: Run tests and generate coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7  
  
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build validation
        run: python -m compileall -q app.py test_app.py

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute tests
        run: pytest -v
